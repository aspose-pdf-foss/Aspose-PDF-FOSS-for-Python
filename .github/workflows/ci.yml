name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  minimal-install:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package without optional dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Verify optional dependencies are absent
        run: |
          # Import names for every optional runtime dependency: images (PIL),
          # woff2 (brotli), and text-layout (fontTools, uharfbuzz, bidi).
          python -c "import importlib.util; assert importlib.util.find_spec('PIL') is None"
          python -c "import importlib.util; assert importlib.util.find_spec('brotli') is None"
          python -c "import importlib.util; assert importlib.util.find_spec('fontTools') is None"
          python -c "import importlib.util; assert importlib.util.find_spec('uharfbuzz') is None"
          python -c "import importlib.util; assert importlib.util.find_spec('bidi') is None"

      - name: Run test suite without optional dependencies
        run: pytest -q

  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run lint
        run: ruff check src/ tests/

      - name: Run test suite
        run: pytest -q

      - name: Check shipped modules compile and import
        run: |
          python -m compileall -q src/aspose_pdf
          python -c "import aspose_pdf.annotations.pdf3d, aspose_pdf.svg, aspose_pdf.xmp"

      - name: Build package
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

  cross-validate:
    # Every other job asks whether the library agrees with itself. This one asks
    # whether independent implementations agree with it: qpdf (through pikepdf)
    # parses and rewrites what we write, and veraPDF -- the reference PDF/A
    # validator this project's own documentation points users at -- reaches a
    # verdict on our PDF/A output.
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package, dev dependencies and pikepdf
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev] pikepdf

      - name: Cross-validate against qpdf
        run: pytest -q tests/test_cross_validation.py

      # veraPDF is the reference PDF/A validator, and the one this project's
      # documentation tells users to run. It is deliberately non-blocking:
      # this library's PDF/A support is heuristic by design, so the useful
      # output is *which* rules a sample fails, published as an artifact for a
      # human to read, rather than a pass/fail gate it was never built to meet.
      - name: Write conformance samples
        run: python scripts/write_conformance_samples.py conformance-samples

      - name: Validate the samples with veraPDF
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD/conformance-samples:/data" \
            verapdf/cli:latest --format mrr --recurse /data \
            > verapdf-report.xml

      - name: Publish the veraPDF report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verapdf-report
          path: |
            verapdf-report.xml
            conformance-samples/
          if-no-files-found: warn
