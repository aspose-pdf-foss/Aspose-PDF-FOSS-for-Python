name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  minimal-install:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package without optional dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Verify optional dependencies are absent
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('PIL') is None"
          python -c "import importlib.util; assert importlib.util.find_spec('brotli') is None"
          python -c "import importlib.util; assert importlib.util.find_spec('fontTools') is None"

      - name: Run test suite without optional dependencies
        run: pytest -q

  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run lint
        run: ruff check src/

      - name: Run test suite
        run: pytest -q

      - name: Check shipped modules compile and import
        run: |
          python -m compileall -q src/aspose_pdf
          python -c "import aspose_pdf.annotations.pdf3d, aspose_pdf.svg, aspose_pdf.xmp"

      - name: Build package
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*
